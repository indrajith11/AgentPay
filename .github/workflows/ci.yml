name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agentpay/contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  slither:
    runs-on: ubuntu-latest
    container:
      image: crytic/slither
    steps:
      - uses: actions/checkout@v4
      - name: Run Slither
        run: |
          pip install --quiet solc-select || true
          slither agentpay/contracts --solc-autodetect \
            --filter-paths "node_modules|mock|Mock" \
            || echo "::warning::Slither findings - must be dispositioned in agentpay/contracts/SECURITY.md"

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
